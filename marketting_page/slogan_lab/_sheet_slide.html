<!doctype html><html><head><meta charset="utf-8"><title>sheet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;font-family:-apple-system,sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.cell{background:#fff;position:relative;height:250px;overflow:hidden}
.lbl{position:absolute;left:4px;top:2px;font-size:12px;color:#c00;z-index:99;font-weight:700}
.fx-stage{position:absolute;inset:16px 20px;display:flex;align-items:center;justify-content:center;
  font-size:34px;line-height:1.18;letter-spacing:-.02em;text-align:center;color:#1d1d1f}
.fx-stage .fx-light{font-weight:300}
.fx-stage .fx-bold{font-weight:650}
</style></head><body>
<div class="grid" id="g"></div>
<script src="engine.js"></script>
<script src="effects/slide.js"></script>
<script>
const SLOGANS = [
  ["A motor, and everything",               "that usually surrounds it."],
  ["The whole drive system.",               "Inside one motor."],
  ["Four systems.",                         "One motor."],
  ["Motion control,",                       "fully integrated."],
  ["You wanted motion.",                    "Not a wiring project."],
  ["A motor that",                          "needs nothing else."],
  ["The whole motion system.",              "One motor."],
  ["Everything that moves it,",             "inside it."],
  ["Motion control.",                       "All in one."],
  ["Stepper, driver, controller, encoder.", "One part number."],
  ["Bolts in like a stepper.",              "Runs like a full servo."],
  ["Four bolts. One cable.",                "A complete servo system."],
  ["Servomotor:",                           "stepper, driver, controller and encoder in one."],
  ["No driver board. No encoder to mount.", "It's all inside."],
  ["Driver, controller and encoder",        "are no longer your problem."],
];
const q=new URLSearchParams(location.search);
const id=q.get('only'); const i=parseInt(q.get('i')||'0',10);
const TS=(q.get('ts')||'0,0.02,0.15,0.3,0.5,0.7,0.85,0.98,1').split(',').map(Number);
const fx=SloganFX.get(id);
const g=document.getElementById('g');
TS.forEach(t=>{
  const c=document.createElement('div'); c.className='cell';
  const l=document.createElement('div'); l.className='lbl'; l.textContent='t='+t;
  const s=document.createElement('div');
  const th=fx.theme||{};
  if(th.bg)c.style.background=th.bg; if(th.fg)s.style.color=th.fg;
  if(th.font)s.style.fontFamily=th.font;
  c.appendChild(l); c.appendChild(s); g.appendChild(c);
  const p=SloganFX.mount(s,fx,SLOGANS,{start:i});
  p.pause(); p.seek(i,t);
});
</script></body></html>
