<!doctype html><meta charset="utf-8"><title>mprobe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:-apple-system,sans-serif}
.stagebox{position:relative;background:#FAF8F3;color:#191A1C;height:434px;padding:18px 22px;overflow:hidden}
.fx-stage{position:absolute;inset:18px 22px;display:flex;align-items:center;justify-content:center;
  font-size:57.2px;line-height:1.18;letter-spacing:-.02em;text-align:center}
.fx-stage .fx-light{font-weight:300}
.fx-stage .fx-bold{font-weight:650}
pre{font:11px monospace;white-space:pre-wrap}
</style>
<div class="stagebox"><div id="s" class="fx-stage"></div></div>
<pre id="out"></pre>
<script src="engine.js"></script>
<script src="effects/mechanical.js"></script>
<script>
var q=new URLSearchParams(location.search);
var ID=q.get('id')||'mechanical-word-odometer';
var I=parseInt(q.get('i')||'0',10), T=parseFloat(q.get('t')||'0.5');
var SLOGANS = [
  ["A motor, and everything","that usually surrounds it."],
  ["The whole drive system.","Inside one motor."],
  ["Four systems.","One motor."],
  ["Motion control,","fully integrated."],
  ["You wanted motion.","Not a wiring project."],
  ["A motor that","needs nothing else."],
  ["The whole motion system.","One motor."],
  ["Everything that moves it,","inside it."],
  ["Motion control.","All in one."],
  ["Stepper, driver, controller, encoder.","One part number."],
  ["Bolts in like a stepper.","Runs like a full servo."],
  ["Four bolts. One cable.","A complete servo system."],
  ["Servomotor:","stepper, driver, controller and encoder in one."],
  ["No driver board. No encoder to mount.","It's all inside."],
  ["Driver, controller and encoder","are no longer your problem."],
];
var st=document.getElementById('s');
var fx=SloganFX.get(ID);
if(fx.theme&&fx.theme.font) st.style.fontFamily=fx.theme.font;
if(fx.theme&&fx.theme.bg) document.querySelector('.stagebox').style.background=fx.theme.bg;
if(fx.theme&&fx.theme.fg) document.querySelector('.stagebox').style.color=fx.theme.fg;
var p=SloganFX.mount(st, fx, SLOGANS, {start:I});
var o=[];
function rects(label){
  var lr=p.layer.getBoundingClientRect();
  function R(n){var r=n.getBoundingClientRect();return [Math.round(r.left-lr.left),Math.round(r.top-lr.top),Math.round(r.right-lr.left),Math.round(r.bottom-lr.top)];}
  o.push(label+' canonA '+R(p.canonA)+' canonB '+R(p.canonB));
}
p.seek(I,0); rects('t=0');
p.seek(I,T);
var lr=p.layer.getBoundingClientRect();
o.push('LAYER '+Math.round(lr.width)+'x'+Math.round(lr.height));
o.push('drums '+JSON.stringify((p.layer._drums||[]).map(function(d){return [d.fa?d.fa.textContent:'-',Math.round(d.x0),Math.round(d.y0),Math.round(d.x1),Math.round(d.y1),d.same];})));
// live rects of visible faces
p.layer.querySelectorAll('span').forEach(function(f){
  if(f.style.opacity==='0')return;
  var r=f.getBoundingClientRect();
  o.push('FACE "'+f.textContent+'" l='+Math.round(r.left-lr.left)+' t='+Math.round(r.top-lr.top)+' w='+Math.round(r.width)+' h='+Math.round(r.height)+' op='+f.style.opacity);
});
document.getElementById('out').textContent=o.join('\n');
</script>
