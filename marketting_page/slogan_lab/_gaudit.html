<!DOCTYPE html><html><head><meta charset="utf-8"><title>g</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c0d;color:#eee;font-family:-apple-system,sans-serif}
.row{display:flex;align-items:center;gap:0;border-bottom:1px solid #333}
.lab{width:54px;flex:none;font-size:12px;color:#8f8;text-align:right;padding-right:6px;font-variant-numeric:tabular-nums}
.stagebox{position:relative;background:#fff;color:#1d1d1f;height:150px;flex:1;padding:14px 18px;overflow:hidden}
.fx-stage{position:absolute;inset:14px 18px;display:flex;align-items:center;justify-content:center;
  font-size:26px;line-height:1.18;letter-spacing:-.02em;text-align:center}
.fx-stage .fx-light{font-weight:300}
.fx-stage .fx-bold{font-weight:650}
</style></head><body>
<div id="out"></div>
<script src="engine.js"></script><script src="manifest.js"></script>
<script>
const SLOGANS = [
  ["A motor, and everything","that usually surrounds it."],
  ["The whole drive system.","Inside one motor."],
  ["Four systems.","One motor."],
  ["Motion control,","fully integrated."],
  ["You wanted motion.","Not a wiring project."],
  ["A motor that","needs nothing else."],
  ["The whole motion system.","One motor."],
  ["Everything that moves it,","inside it."],
  ["Motion control.","All in one."],
  ["Stepper, driver, controller, encoder.","One part number."],
  ["Bolts in like a stepper.","Runs like a full servo."],
  ["Four bolts. One cable.","A complete servo system."],
  ["Servomotor:","stepper, driver, controller and encoder in one."],
  ["No driver board. No encoder to mount.","It's all inside."],
  ["Driver, controller and encoder","are no longer your problem."],
];
(async function(){
  for (const f of (window.SLOGAN_FX_FILES||[])) {
    await new Promise(res=>{const s=document.createElement('script');s.src=f+'?v='+Date.now();s.onload=res;s.onerror=res;document.head.appendChild(s);});
  }
  const q=new URLSearchParams(location.search);
  const id=q.get('only'); const i=+(q.get('i')||0);
  const ts=(q.get('ts')||'0,0.02,0.15,0.3,0.5,0.7,0.85,0.98,1').split(',').map(Number);
  const fx=SloganFX.get(id);
  const out=document.getElementById('out');
  ts.forEach(t=>{
    const row=document.createElement('div');row.className='row';
    const lab=document.createElement('div');lab.className='lab';lab.textContent=t;
    const box=document.createElement('div');box.className='stagebox';
    const th=fx.theme||{}; if(th.bg)box.style.background=th.bg; if(th.fg)box.style.color=th.fg;
    const stage=document.createElement('div'); if(th.font)stage.style.fontFamily=th.font; if(th.italic)stage.style.fontStyle='italic';
    box.appendChild(stage); row.appendChild(lab); row.appendChild(box); out.appendChild(row);
    const p=SloganFX.mount(stage,fx,SLOGANS,{start:i});
    p.seek(i,t);
  });
  document.title='ready';
})();
</script></body></html>
