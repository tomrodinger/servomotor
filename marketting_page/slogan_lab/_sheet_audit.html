<!doctype html><meta charset="utf-8"><title>audit sheet</title>
<style>
 body{margin:0;background:#222;font:11px monospace;color:#fff}
 .g{display:flex;flex-wrap:wrap}
 .c{width:660px;height:360px;position:relative;overflow:hidden;margin:2px}
 .c iframe{width:1300px;height:700px;border:0;transform:scale(.5);transform-origin:0 0;position:absolute;left:0;top:0}
 .lab{position:absolute;right:2px;top:2px;z-index:9;background:#000;color:#0f0;padding:1px 4px}
</style>
<div class="g" id="g"></div>
<script>
var q=new URLSearchParams(location.search);
var id=q.get('id'), i=q.get('i')||'0';
var ts=(q.get('ts')||'0,0.02,0.15,0.3,0.5,0.7,0.85,0.98,1').split(',');
var g=document.getElementById('g');
ts.forEach(function(t){
  var c=document.createElement('div');c.className='c';
  var l=document.createElement('div');l.className='lab';l.textContent='t='+t;
  var f=document.createElement('iframe');
  f.src='index.html?only='+encodeURIComponent(id)+'&big=1&i='+i+'&t='+t;
  c.appendChild(f);c.appendChild(l);g.appendChild(c);
});
</script>
