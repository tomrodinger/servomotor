<!doctype html><meta charset="utf-8"><title>m</title>
<style>body{font:40px monospace;margin:0}iframe{width:1440px;height:800px;border:0;position:absolute;left:-9999px}</style>
<div id="o">measuring…</div>
<iframe id="f" src="/premium_minimal_variations/v7.html"></iframe>
<script>
const widths=[1440,1200,1024,900,768,600,390];
const f=document.getElementById('f');let i=0,res=[];
function step(){
  if(i>=widths.length){document.getElementById('o').textContent=res.join('  |  ');return;}
  const w=widths[i];f.style.width=w+'px';
  f.onload=null;
  setTimeout(()=>{
    const d=f.contentDocument;
    const h=d.documentElement.scrollHeight;
    const sw=d.documentElement.scrollWidth;
    res.push(w+'px: H='+h+' SW='+sw);
    i++;step();
  },400);
}
f.addEventListener('load',()=>setTimeout(step,600),{once:true});
</script>
