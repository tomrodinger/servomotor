<!DOCTYPE html><html><head><meta charset="utf-8"><title>kin check</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c0d;color:#ececf0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.tile{background:#151517;border:1px solid #26262a}
.thead{padding:6px 12px;font-size:12px;border-bottom:1px solid #26262a}
.thead .fam{color:#7AB648;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-left:8px}
.stagebox{position:relative;background:#fff;color:#1d1d1f;height:min(62vh,520px);min-height:320px;padding:18px 22px;overflow:hidden}
.fx-stage{position:absolute;inset:18px 22px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(30px,4.4vw,60px);line-height:1.18;letter-spacing:-.02em;text-align:center}
.fx-stage .fx-light{font-weight:300}
.fx-stage .fx-bold{font-weight:650}
#err{color:#ff6b6b;font:12px/1.5 monospace;padding:8px 12px;white-space:pre-wrap}
</style></head><body>
<div class="tile"><div class="thead"><b id="nm"></b><span class="fam" id="fm"></span></div>
<div class="stagebox"><div id="stage"></div></div></div>
<div id="err"></div>
<script src="../slogan_lab/engine.js"></script>
<script src="../slogan_lab/effects/kinetic.js"></script>
<script>
const SLOGANS = [
  ["A motor, and everything",               "that usually surrounds it."],
  ["The whole drive system.",               "Inside one motor."],
  ["Four systems.",                         "One motor."],
  ["Motion control,",                       "fully integrated."],
  ["You wanted motion.",                    "Not a wiring project."],
  ["A motor that",                          "needs nothing else."],
  ["The whole motion system.",              "One motor."],
  ["Everything that moves it,",             "inside it."],
  ["Motion control.",                       "All in one."],
  ["Stepper, driver, controller, encoder.", "One part number."],
  ["Bolts in like a stepper.",              "Runs like a full servo."],
  ["Four bolts. One cable.",                "A complete servo system."],
  ["Servomotor:",                           "stepper, driver, controller and encoder in one."],
  ["No driver board. No encoder to mount.", "It's all inside."],
  ["Driver, controller and encoder",        "are no longer your problem."],
];
const q = new URLSearchParams(location.search);
const id = q.get('only'), i = parseInt(q.get('i')||'0',10), t = parseFloat(q.get('t')||'0');
const fx = SloganFX.get(id);
const box = document.querySelector('.stagebox'), stage = document.getElementById('stage');
if (!fx) { document.getElementById('err').textContent = 'no such effect: '+id; }
else {
  document.getElementById('nm').textContent = fx.name;
  document.getElementById('fm').textContent = fx.family;
  const th = fx.theme||{};
  if (th.bg) box.style.background = th.bg;
  if (th.fg) box.style.color = th.fg;
  if (th.font) stage.style.fontFamily = th.font;
  if (th.italic) stage.style.fontStyle = 'italic';
  try { const p = SloganFX.mount(stage, fx, SLOGANS, {start:i}); p.pause(); p.seek(i,t); }
  catch(e){ document.getElementById('err').textContent = 'THREW: '+(e&&e.stack||e); }
}
</script></body></html>
