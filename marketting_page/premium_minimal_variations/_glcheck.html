<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>glitch harness</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0c0c0d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .stagebox{position:relative;background:#fff;color:#1d1d1f;height:100%;padding:18px 22px;overflow:hidden}
  .fx-stage{position:absolute;inset:18px 22px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(30px,4.4vw,60px);line-height:1.18;letter-spacing:-.02em;text-align:center}
  .fx-stage .fx-light{font-weight:300}
  .fx-stage .fx-bold{font-weight:650}
  #tag{position:fixed;left:6px;top:4px;z-index:9;font:11px ui-monospace,Menlo,monospace;color:#7AB648;
    background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="stagebox" id="box"><div id="stage"></div></div>
<div id="tag">…</div>
<script src="../slogan_lab/engine.js"></script>
<script src="../slogan_lab/effects/glitch.js"></script>
<script>
const SLOGANS = [
  ["A motor, and everything",               "that usually surrounds it."],
  ["The whole drive system.",               "Inside one motor."],
  ["Four systems.",                         "One motor."],
  ["Motion control,",                       "fully integrated."],
  ["You wanted motion.",                    "Not a wiring project."],
  ["A motor that",                          "needs nothing else."],
  ["The whole motion system.",              "One motor."],
  ["Everything that moves it,",             "inside it."],
  ["Motion control.",                       "All in one."],
  ["Stepper, driver, controller, encoder.", "One part number."],
  ["Bolts in like a stepper.",              "Runs like a full servo."],
  ["Four bolts. One cable.",                "A complete servo system."],
  ["Servomotor:",                           "stepper, driver, controller and encoder in one."],
  ["No driver board. No encoder to mount.", "It's all inside."],
  ["Driver, controller and encoder",        "are no longer your problem."],
];
const q = new URLSearchParams(location.search);
const id = q.get('only');
const fx = SloganFX.get(id);
const box = document.getElementById('box'), stage = document.getElementById('stage');
const tag = document.getElementById('tag');
if (!fx) { tag.textContent = 'NO SUCH EFFECT: ' + id; }
else {
  const th = fx.theme || {};
  if (th.bg) box.style.background = th.bg;
  if (th.fg) box.style.color = th.fg;
  if (th.font) stage.style.fontFamily = th.font;
  if (th.italic) stage.style.fontStyle = 'italic';
  const i = parseInt(q.get('i') || '0', 10), t = parseFloat(q.get('t') || '0');
  const p = SloganFX.mount(stage, fx, SLOGANS, { start: i });
  p.pause();
  document.fonts.ready.then(() => { p.seek(i, t); });
  p.seek(i, t);
  tag.textContent = id + '  i=' + i + '  t=' + t;
}
</script>
</body>
</html>
