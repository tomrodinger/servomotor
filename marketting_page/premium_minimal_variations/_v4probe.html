<!doctype html><meta charset="utf-8"><title>probe</title>
<style>html,body{margin:0;background:#fff;font:12px monospace;white-space:pre}
iframe{width:100%;height:900px;border:0;display:block}</style>
<div id="out">pending</div>
<iframe id="f" src="/premium_minimal_variations/v4.html?anim=1&pause=1"></iframe>
<script>
var f=document.getElementById('f');
f.addEventListener('load',function(){
  setTimeout(function(){
  var d=f.contentDocument, w=f.contentWindow;
  var stage=d.querySelector('.sl-stage');
  var rows=[];
  rows.push('detected idx='+w.__slogan.index());
  rows.push('stageH='+stage.offsetHeight+' stageW='+stage.clientWidth+' h1H='+d.querySelector('.hero h1').offsetHeight);
  for(var i=0;i<w.__slogan.items.length;i++){
    w.__slogan.goto(i);
    var cur=d.querySelector('.sl-cur');
    var r=cur.getBoundingClientRect();
    rows.push(i+': h='+Math.round(r.height)+' w='+Math.round(r.width)+'  "'+w.__slogan.items[i][0]+' | '+w.__slogan.items[i][1]+'"');
  }
  rows.push('bodyScrollW='+d.body.scrollWidth+' docClientW='+d.documentElement.clientWidth);
  document.getElementById('out').textContent=rows.join('\n');
  },300);
});
</script>
