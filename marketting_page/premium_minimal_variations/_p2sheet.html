<!doctype html><meta charset="utf-8"><title>p2 sheet</title>
<style>
 html,body{margin:0;padding:0;background:#888;font:11px/1.2 monospace}
 .row{position:relative;overflow:hidden;margin:0 0 6px;background:#fff}
 .row iframe{position:absolute;left:0;border:0;display:block}
 .lab{position:absolute;right:4px;top:2px;z-index:5;background:rgba(0,0,0,.65);color:#fff;padding:2px 6px;border-radius:3px}
</style>
<div id="sheet"></div>
<script>
// ?w=1440&h=430&top=70&s=0,0.15|0,0.35|...   (pairs = seek i,t ; single number = goto i)
var q=new URLSearchParams(location.search);
var W=+(q.get('w')||1440), H=+(q.get('h')||430), TOP=+(q.get('top')||70);
var states=(q.get('s')||'0').split('|');
var sheet=document.getElementById('sheet');
var frames=[];
states.forEach(function(st){
  var d=document.createElement('div'); d.className='row';
  d.style.width=W+'px'; d.style.height=H+'px';
  var lab=document.createElement('div'); lab.className='lab'; lab.textContent=st;
  var f=document.createElement('iframe');
  f.style.width=W+'px'; f.style.height='2000px'; f.style.top=(-TOP)+'px';
  f.setAttribute('scrolling','no');
  f.src='/premium_minimal_variations/v2.html?motion=1';
  d.appendChild(f); d.appendChild(lab); sheet.appendChild(d);
  frames.push({f:f,st:st});
});
window.addEventListener('load',function(){
  setTimeout(function(){
    frames.forEach(function(o){
      var S=o.f.contentWindow.__slogan;
      if(!S){o.f.contentDocument.body.style.outline='4px solid red';return;}
      S.pause();
      var p=o.st.split(',');
      if(p.length>1) S.seek(+p[0],+p[1]); else S.goto(+p[0]);
    });
    document.title='ready';
  },900);
});
</script>
