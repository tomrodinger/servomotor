<!doctype html><meta charset="utf-8"><title>p5</title>
<style>html,body{margin:0}iframe{width:1440px;height:1400px;border:0}pre{white-space:pre-wrap;max-width:1400px}
pre{position:fixed;left:0;top:0;z-index:9;background:#fff;font:15px/1.5 monospace;padding:8px;border:1px solid #000}</style>
<iframe id="f" src="v5.html?motion=1&i=2"></iframe>
<pre id="out">…</pre>
<script>
setTimeout(function(){
  var fr=document.getElementById('f'), d=fr.contentDocument, w=fr.contentWindow;
  var h1=d.querySelector('.hero h1'), stage=d.getElementById('sg');
  var L=[];
  L.push('h1 fontSize='+getComputedStyle(h1).fontSize+' w='+h1.offsetWidth+' h='+h1.offsetHeight);
  L.push('stage h='+stage.offsetHeight+' cssvar='+stage.style.getPropertyValue('--sg-h'));
  L.push('__slogan idx='+(w.__slogan?w.__slogan.index():'MISSING'));
  var hs=[];
  for(var i=0;i<15;i++){
    w.__slogan.goto(i);
    hs.push(i+':'+h1.offsetHeight+'/'+stage.offsetHeight);
  }
  L.push('per-slogan h1H/stageH: '+hs.join(' '));
  L.push('doc scrollW='+d.documentElement.scrollWidth+' clientW='+d.documentElement.clientWidth);
  w.__slogan.goto(2);
  document.getElementById('out').textContent=L.join('\n');
},2600);
</script>
