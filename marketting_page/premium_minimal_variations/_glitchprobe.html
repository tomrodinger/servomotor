<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>glitch probe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#222;height:100%}
.stagebox{position:relative;background:#fff;color:#1d1d1f;width:1200px;height:460px;padding:22px 30px;overflow:hidden;margin:20px auto}
.fx-stage{position:absolute;inset:22px 30px;display:flex;align-items:center;justify-content:center;
  font-size:48px;line-height:1.18;letter-spacing:-.02em;text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.fx-stage .fx-light{font-weight:300}
.fx-stage .fx-bold{font-weight:650}
#err{color:#f66;font:12px monospace;padding:8px 20px;white-space:pre-wrap}
</style></head><body>
<div class="stagebox" id="box"><div class="fx-stage" id="stage"></div></div>
<div id="err"></div>
<script src="../slogan_lab/engine.js"></script>
<script src="../slogan_lab/effects/glitch.js"></script>
<script>
const SLOGANS = [
  ["A motor, and everything","that usually surrounds it."],
  ["The whole drive system.","Inside one motor."],
  ["Four systems.","One motor."],
  ["Motion control,","fully integrated."],
  ["You wanted motion.","Not a wiring project."],
  ["A motor that","needs nothing else."],
  ["The whole motion system.","One motor."],
  ["Everything that moves it,","inside it."],
  ["Motion control.","All in one."],
  ["Stepper, driver, controller, encoder.","One part number."],
  ["Bolts in like a stepper.","Runs like a full servo."],
  ["Four bolts. One cable.","A complete servo system."],
  ["Servomotor:","stepper, driver, controller and encoder in one."],
  ["No driver board. No encoder to mount.","It's all inside."],
  ["Driver, controller and encoder","are no longer your problem."],
];
window.onerror = function(m){ document.getElementById('err').textContent += 'ERROR: '+m+'\n'; };
const q=new URLSearchParams(location.search);
const fx=SloganFX.get(q.get('id'));
const box=document.getElementById('box'), stage=document.getElementById('stage');
if(!fx){document.getElementById('err').textContent='no such effect '+q.get('id');}
else{
  const th=fx.theme||{};
  if(th.bg)box.style.background=th.bg;
  if(th.fg)box.style.color=th.fg;
  if(th.font)stage.style.fontFamily=th.font;
  if(th.italic)stage.style.fontStyle='italic';
  const i=parseInt(q.get('i')||'9',10), t=parseFloat(q.get('t')||'0');
  const p=SloganFX.mount(stage,fx,SLOGANS,{start:i});
  p.pause(); p.seek(i,t);
  document.getElementById('err').textContent += fx.id+'  i='+i+'  t='+t;
}
</script></body></html>
