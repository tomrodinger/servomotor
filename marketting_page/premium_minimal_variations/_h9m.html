<!doctype html><meta charset="utf-8"><title>m</title>
<style>body{font:12px/1.35 monospace;margin:0;padding:8px;background:#fff}
#f{position:absolute;left:-9999px;top:0;border:0}
pre{white-space:pre-wrap}</style>
<pre id="o">loading…</pre>
<iframe id="f"></iframe>
<script>
var W = parseInt((location.search.match(/w=(\d+)/)||[0,1440])[1],10);
var f=document.getElementById('f'), o=document.getElementById('o');
f.style.width=W+'px'; f.style.height='2200px';
f.src='v9.html?motion=1&goto=0';
f.onload=function(){
  setTimeout(function(){
    var w=f.contentWindow, d=w.document, s=w.__slogan, out=[];
    if(!s){o.textContent='NO __slogan';return;}
    out.push('width='+W+' clientW='+d.documentElement.clientWidth+' reduced='+s.reduced());
    s.pause();
    var maxSW=0;
    for(var i=0;i<s.items.length;i++){
      s.goto(i);
      var h1=d.querySelector('.hero h1').getBoundingClientRect();
      var lede=d.querySelector('.hero .lede').getBoundingClientRect();
      var sw=d.documentElement.scrollWidth;
      maxSW=Math.max(maxSW,sw);
      out.push(('  '+i).slice(-3)+' h1H='+h1.height.toFixed(1)+' h1Top='+h1.top.toFixed(1)
        +' ledeTop='+lede.top.toFixed(1)+' bodyH='+d.body.scrollHeight+' scrollW='+sw);
    }
    // mid-transition overflow check
    var midSW=0;
    for(var i=0;i<s.items.length;i++){
      for(var t=0.1;t<1;t+=0.1){ s.seek(i,t); midSW=Math.max(midSW,d.documentElement.scrollWidth); }
    }
    out.push('MAX scrollW rest='+maxSW+'  mid='+midSW+'  clientW='+d.documentElement.clientWidth);
    s.goto(0);
    o.textContent=out.join('\n');
  },1200);
};
</script>
